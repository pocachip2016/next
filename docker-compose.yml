services:
  mysql:
    image: mysql:8.0
    container_name: next-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db_mysql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: sh -c 'mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}'
      interval: 10s
      timeout: 5s
      retries: 10

  rightwatch:
    build:
      context: ./backend/apiServer/rightwatch
    container_name: next-rightwatch
    restart: unless-stopped
    ports:
      - "5555:5555"
    depends_on:
      mysql:
        condition: service_healthy

  pricemon:
    build:
      context: ./backend/apiServer/pricemon
    container_name: next-pricemon
    restart: unless-stopped
    ports:
      - "5556:5556"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/ngx-admin2
    container_name: next-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - rightwatch
      - pricemon

  crawler:
    build:
      context: ./backend/crawler/scrapy
    container_name: next-crawler
    restart: unless-stopped
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - crawler-logs:/var/log
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  crawler-logs:
