<nb-card>
  <nb-card-header>CP 대시보드</nb-card-header>
  <nb-card-body>

    <div *ngIf="loading" class="loading">
      <nb-spinner status="primary"></nb-spinner>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <div *ngIf="!loading && !error">
      <div *ngIf="items.length === 0" class="empty">탐지 데이터가 없습니다.</div>

      <table *ngIf="items.length > 0" class="cp-table">
        <thead>
          <tr>
            <th>CP명</th>
            <th>탐지 건수</th>
            <th>웹하드별 분포</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items">
            <td>{{ item.cp_name }}</td>
            <td class="detected">{{ item.detected }}</td>
            <td>
              <span *ngIf="item.by_webhard.length === 0">—</span>
              <span
                *ngFor="let w of item.by_webhard"
                class="webhard-badge"
              >사이트{{ w.website }}: {{ w.count }}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </nb-card-body>
</nb-card>
