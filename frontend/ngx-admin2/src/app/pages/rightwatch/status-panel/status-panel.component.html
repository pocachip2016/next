<nb-card>
  <nb-card-header>
    상태 관리 패널
    <button nbButton size="small" status="basic" (click)="refresh()" style="float:right">새로고침</button>
  </nb-card-header>
  <nb-card-body>

    <div *ngIf="loading" class="loading">
      <nb-spinner status="primary"></nb-spinner>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <div *ngIf="!loading && !error">
      <div *ngIf="items.length === 0" class="empty">탐지 데이터가 없습니다.</div>

      <table *ngIf="items.length > 0" class="status-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>게시물 제목</th>
            <th>상태</th>
            <th>액션</th>
            <th>캡처</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of items">
            <tr>
              <td>{{ item.id }}</td>
              <td class="post-txt" [title]="item.post_txt">{{ item.post_txt }}</td>
              <td>
                <span [class]="'status-badge ' + statusClass(item.status)">
                  {{ statusLabel(item.status) }}
                </span>
              </td>
              <td>
                <button
                  *ngIf="actionLabel(item.status)"
                  nbButton size="small"
                  [status]="item.status === 0 ? 'warning' : item.status === 1 ? 'info' : 'success'"
                  [disabled]="item.loadingAction"
                  (click)="performAction(item)"
                >{{ actionLabel(item.status) }}</button>
                <span *ngIf="!actionLabel(item.status)">—</span>
              </td>
              <td class="capture-cell">
                <button nbButton size="tiny" status="basic"
                  [disabled]="captureLoading[item.id]"
                  (click)="captureImage(item)"
                  title="페이지 캡처">
                  <nb-icon *ngIf="!captureLoading[item.id]" icon="camera-outline"></nb-icon>
                  <nb-spinner *ngIf="captureLoading[item.id]" size="tiny"></nb-spinner>
                </button>
                <button *ngIf="captures[item.id]?.length || showCaptures[item.id]"
                  nbButton size="tiny" status="info" ghost
                  (click)="toggleCaptures(item)"
                  title="이미지 목록">
                  {{ (captures[item.id]?.length || 0) }}장
                </button>
                <span *ngIf="captureMsg[item.id]" class="capture-msg">{{ captureMsg[item.id] }}</span>
              </td>
            </tr>
            <tr *ngIf="results[item.id]" class="result-row">
              <td colspan="5" class="result-msg">✓ {{ results[item.id] }}</td>
            </tr>
            <tr *ngIf="showCaptures[item.id] && captures[item.id]?.length" class="capture-gallery-row">
              <td colspan="5">
                <div class="capture-gallery">
                  <a *ngFor="let cap of captures[item.id]"
                    [href]="captureUrl(cap)" target="_blank" class="capture-thumb-link"
                    [title]="cap.captured_at">
                    <img [src]="captureUrl(cap)" class="capture-thumb" loading="lazy" />
                  </a>
                </div>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>

  </nb-card-body>
</nb-card>
